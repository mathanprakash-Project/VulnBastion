[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnbastion"
version = "1.0.0"
description = "TawasolPay CyberSentinel: Live Multi-Dimensional Cyber Risk & NIST 800-53 RAG Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "TawasolPay Security Engineering"}
]
dependencies = [
    "streamlit>=1.39.0,<1.50.0",
    "pandas>=2.2.0,<2.3.0",
    "numpy>=1.26.0,<2.0.0",
    "chromadb==0.5.23",
    "sentence-transformers==3.0.1",
    "transformers==4.44.2",
    "huggingface-hub==0.24.7",
    "tokenizers==0.19.1",
    "groq>=0.11.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.0.0",
    "tenacity>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

