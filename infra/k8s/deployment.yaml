apiVersion: apps/v1
kind: Deployment
metadata:
  name: cybersentinel-api
  namespace: cybersentinel
  labels:
    app.kubernetes.io/name: cybersentinel-api
    app.kubernetes.io/component: backend-api
    app.kubernetes.io/part-of: tawasolpay-security
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cybersentinel-api
  template:
    metadata:
      labels:
        app: cybersentinel-api
        app.kubernetes.io/component: backend-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: cybersentinel:latest
          imagePullPolicy: IfNotPresent
          command:
            - "uvicorn"
            - "src.api:app"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--workers"
            - "2"
          ports:
            - name: http-api
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cybersentinel-config
            - secretRef:
                name: cybersentinel-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1.5Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /health
              port: http-api
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http-api
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http-api
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cybersentinel-dashboard
  namespace: cybersentinel
  labels:
    app.kubernetes.io/name: cybersentinel-dashboard
    app.kubernetes.io/component: frontend-ui
    app.kubernetes.io/part-of: tawasolpay-security
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cybersentinel-dashboard
  template:
    metadata:
      labels:
        app: cybersentinel-dashboard
        app.kubernetes.io/component: frontend-ui
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: dashboard
          image: cybersentinel:latest
          imagePullPolicy: IfNotPresent
          command:
            - "streamlit"
            - "run"
            - "src/app.py"
            - "--server.port=8501"
            - "--server.address=0.0.0.0"
            - "--server.headless=true"
          ports:
            - name: http-ui
              containerPort: 8501
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cybersentinel-config
            - secretRef:
                name: cybersentinel-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1.5Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /_stcore/health
              port: http-ui
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http-ui
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http-ui
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2

