apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cybersentinel-api-hpa
  namespace: cybersentinel
  labels:
    app.kubernetes.io/name: cybersentinel-api
    app.kubernetes.io/part-of: tawasolpay-security
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cybersentinel-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60

