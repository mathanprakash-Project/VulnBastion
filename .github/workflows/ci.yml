name: VulnBastion Production CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Lint, Test & Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Verify Health Diagnostics
        run: |
          python src/health.py

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v --tb=short

      - name: Run Baseline RAG Verification
        run: |
          python src/test_rag_real.py

      - name: Run Explainer Regression Test
        run: |
          python src/test_llm_real.py

